apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: app-demo-github-listener
  namespace: tekton-cicd
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: trigger
    app.kubernetes.io/part-of: crc-tekton-gitops-lab
spec:
  serviceAccountName: pipeline
  triggers:
    - name: github-push-main
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
            apiVersion: triggers.tekton.dev
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
            kind: ClusterInterceptor
            apiVersion: triggers.tekton.dev
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.deleted == false &&
                !body.head_commit.message.contains('[skip ci]')
      bindings:
        - ref: app-demo-github-push
      template:
        ref: app-demo-github-push
  resources:
    kubernetesResource:
      serviceType: ClusterIP
