    name: buildah-builder
    namespace: tekton-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-demo-buildah-image-builder
  namespace: tekton-demo-dev
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: image-builder
    app.kubernetes.io/part-of: crc-tekton-gitops-lab
subjects:
  - kind: ServiceAccount
    name: buildah-builder
    namespace: tekton-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
