apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-demo-update-git
  namespace: tekton-cicd
  labels:
    app.kubernetes.io/name: app-demo
    app.kubernetes.io/component: gitops
    app.kubernetes.io/part-of: crc-tekton-gitops-lab
spec:
  description: Update the development image tag and push the GitOps commit.
  params:
    - name: repository-url
      type: string
      description: Writable SSH repository URL.
    - name: branch
      type: string
      default: main
    - name: manifest-path
      type: string
      default: deploy/environments/dev/kustomization.yaml
    - name: image-tag
      type: string
      description: Immutable image tag produced by the build.
    - name: git-user-name
      type: string
      default: tekton-gitops
    - name: git-user-email
      type: string
      default: tekton-gitops@users.noreply.github.com
  workspaces:
    - name: source
      description: Workspace containing the cloned repository.
  results:
    - name: changed
      description: Whether a GitOps commit was created.
    - name: git-commit
      description: Remote Git commit after the update.
  volumes:
    - name: github-deploy-key
      secret:
        secretName: github-deploy-key
  steps:
    - name: update-and-push
      image: registry.redhat.io/openshift-pipelines/pipelines-git-init-rhel9@sha256:d8de2ba836fe94183804e10e122a9e19ff480a63be43feeaf3bc88d5f32c21cb
      env:
        - name: HOME
          value: /tekton/home
      volumeMounts:
        - name: github-deploy-key
          mountPath: /var/run/github-deploy-key
          readOnly: true
      script: |
        #!/usr/bin/env sh
        set -eu

        REPOSITORY_DIR="$(workspaces.source.path)/repository"
        REPOSITORY_URL="$(params.repository-url)"
        BRANCH="$(params.branch)"
        MANIFEST_PATH="$(params.manifest-path)"
        IMAGE_TAG="$(params.image-tag)"

        case "${MANIFEST_PATH}" in
          deploy/environments/dev/kustomization.yaml)
            ;;
          *)
            echo "Refusing to modify unauthorized path: ${MANIFEST_PATH}" >&2
            exit 1
            ;;
        esac

        mkdir -p "${HOME}/.ssh"
        cp /var/run/github-deploy-key/ssh-privatekey "${HOME}/.ssh/id_ed25519"
        cp /var/run/github-deploy-key/known_hosts "${HOME}/.ssh/known_hosts"

        chmod 700 "${HOME}/.ssh"
        chmod 600 "${HOME}/.ssh/id_ed25519"
        chmod 644 "${HOME}/.ssh/known_hosts"

        export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts"

        cd "${REPOSITORY_DIR}"

        git remote set-url origin "${REPOSITORY_URL}"
        git fetch origin "${BRANCH}"
        git checkout -B "${BRANCH}" "origin/${BRANCH}"

        test -f "${MANIFEST_PATH}"
        grep -q '^[[:space:]]*newTag:' "${MANIFEST_PATH}"

        TEMP_FILE="${MANIFEST_PATH}.tmp"

        awk -v tag="${IMAGE_TAG}" '
          /^[[:space:]]*newTag:/ {
            sub(/newTag:.*/, "newTag: " tag)
            found = 1
          }
          { print }
          END {
            if (!found) {
              exit 42
            }
          }
        ' "${MANIFEST_PATH}" > "${TEMP_FILE}"

        mv "${TEMP_FILE}" "${MANIFEST_PATH}"

        if git diff --quiet -- "${MANIFEST_PATH}"; then
          REMOTE_COMMIT="$(git rev-parse HEAD)"
          printf '%s' "false" > "$(results.changed.path)"
          printf '%s' "${REMOTE_COMMIT}" > "$(results.git-commit.path)"

          echo "GitOps manifest already uses image tag ${IMAGE_TAG}"
          echo "Remote commit: ${REMOTE_COMMIT}"
          exit 0
        fi

        git config user.name "$(params.git-user-name)"
        git config user.email "$(params.git-user-email)"

        git add -- "${MANIFEST_PATH}"

        CHANGED_FILES="$(git diff --cached --name-only)"

        if [ "${CHANGED_FILES}" != "${MANIFEST_PATH}" ]; then
          echo "Unexpected staged files detected:" >&2
          printf '%s\n' "${CHANGED_FILES}" >&2
          exit 1
        fi

        git commit -m "chore(gitops): deploy app-demo ${IMAGE_TAG} [skip ci]"
        git push origin "HEAD:${BRANCH}"

        REMOTE_COMMIT="$(git rev-parse HEAD)"

        printf '%s' "true" > "$(results.changed.path)"
        printf '%s' "${REMOTE_COMMIT}" > "$(results.git-commit.path)"

        echo "GitOps update published"
        echo "Image tag: ${IMAGE_TAG}"
        echo "Git commit: ${REMOTE_COMMIT}"
